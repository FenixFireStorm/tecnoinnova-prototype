<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecnoInnova S.A. - Prototipo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-8">
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md">
    <h1 class="text-3xl font-bold text-slate-800 mb-6">TecnoInnova S.A. - Sistema de Gestión</h1>
    <p class="text-slate-600 mb-8">Selecciona un módulo para explorar el prototipo:</p>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <a href="./dashboard_tecnoinnova/index.html" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition font-semibold text-blue-600">
        📊 Dashboard Principal
      </a>
      <a href="./gesti_n_de_pedidos_tecnoinnova/index.html" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition font-semibold text-blue-600">
        📝 Gestión de Pedidos
      </a>
      <a href="./asignaci_n_de_t_cnicos_tecnoinnova/index.html" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition font-semibold text-blue-600">
        🛠️ Asignación de Técnicos
      </a>
      <a href="./control_de_inventario_tecnoinnova/index.html" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition font-semibold text-blue-600">
        📦 Control de Inventario
      </a>
      <a href="./securelogic/index.html" class="p-4 border border-slate-200 rounded-lg hover:bg-slate-50 transition font-semibold text-blue-600">
        🔒 Módulo SecureLogic / Adicional
      </a>
    </div>

    <!-- BOTÓN DE CERRAR -->
    <div class="mt-8 pt-6 border-t border-slate-200 text-center">
  <button 
    onclick="intentarCerrar()" 
    class="px-5 py-2.5 bg-slate-700 hover:bg-slate-800 text-white font-medium rounded-lg shadow transition-colors inline-flex items-center gap-2">
    <span>❌</span>
    Cerrar Prototipo
  </button>
  <!-- Mensaje discreto en texto en lugar de un alert emergente molesto -->
  <p id="mensaje-cierre" class="text-xs text-slate-500 mt-2 hidden">
    Puedes cerrar esta pestaña directamente desde la <b>X</b> de tu navegador.
  </p>
</div>

<script>
  function intentarCerrar() {
    // Intenta cerrar la ventana
    window.close();
    
    // Si no se cierra por restricciones del navegador, muestra el texto en pantalla (sin alert)
    document.getElementById('mensaje-cierre').classList.remove('hidden');
  }
</script>
</body>
</html>
